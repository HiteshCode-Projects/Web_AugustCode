<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
           
           //Math Object - Help us To Calucaltion and Math Related wokr directly

           console.log( Math.PI )
           console.log(Math.SQRT2)
           console.log(Math.sqrt(25))

           console.log(Math.pow(2,4))

           //Logic

           console.log(Math.random())  //By Default in range of 0 - 1

           //Floor - It will Remove The Decimal Number 4.5  --> 4

            console.log(Math.floor(4.8))   // 4
            console.log(Math.floor(2.1))  //  2


           //Ceil -It Converts To Next Higher Whole Number 4.2 --> 5

           console.log(Math.ceil(3.1))   // 4
           console.log(Math.ceil(5.7))   // 6


           //Round if Decimal Nymber < 0.5  -->Remove Deciaml and If Number is > 0.5 or Number is == 0.5->Next higher Whole Number

           console.log(Math.round(6.4))    // 6
           console.log(Math.round(6.5))    //  7
           console.log(Math.round(6.6))    //  7


           console.log  ( Math.floor(  Math.random() * 4   ))

    </script>
