<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    <script>
        //Print Number 1 to 10 - console

        // console.log(1)
        // console.log(2)
        // console.log(3)


        //RULE: CONDITION IS TRUE LOOP STARTS CONDITION FALSE LOOP STOPS

        //1. for(  start point;  ending/condition ; ++ or -- (Operations)     )  Loop - Startint Point and Ending Point
        //Print Number 1 to 10 - console

        for(let i= 1; i <= 10; i++ ){
                  //Task 
            console.log(" The value of i " , i)
        }

         //Print Number 10 to 1 - console
           for(let j= 10; j >=1 ; j-- ){
                  //Task 
            console.log(" The value of j " , j)
        }


         //RULE: CONDITION IS TRUE LOOP STARTS CONDITION FALSE LOOP STOPS

        //2 . while(condition){ Task } Loop
         
        let count = 1

        while(count<=5){

            console.log("Login Attempt " , count)
            count++

        }

        //3.Do While Loop - It will execute-run The code ATLEAST one time
         let number = 7

        do{
            //Task
            console.log("good evening")
        }while(number < 5)
        

        //Array - use for loop for accessing data of aaray

        const fruits = ["mango" ,"orange", "kiwi"]

        //last index = length - 1

        for( let k = 0;  k <=  fruits.length -1; k++ ){


            console.log(fruits[k])
        }


    </script>
</body>
