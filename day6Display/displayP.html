<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #myp{
            display: none;
        }

       

        #ex1{
            color: red;
            display: inline;
            background-color: aqua;
        }

          #ex2{
            color: red;
            display: block;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <p id="myp">Hello Big Billion Day Sale is LIVE!!!!</p>


    <div>
        This is an Example of Inline Display
        <p id="ex1">Hello Inline</p>
    </div>


    <div>
        This is an Example of Block Display
        <p id="ex2">Hello Block</p>
    </div>
</body>
</html>
