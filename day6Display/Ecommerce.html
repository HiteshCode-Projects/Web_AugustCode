<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            background-color: #f9f9f9;


            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
            gap: 25px;

           
        }

        .product{
            border: 1px solid black;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            height: 320px;
            text-align: center;

            /* box-shadow: Xaxis YAxis Spread-Radius ColorName; */

            box-shadow:    4px     4px       8px             black;

        }


        .product:hover{
            background-color: #ff0000;
            transition: 2s;
            transform: scale(1.03);
            color: white;
        }


        .product img{
            width: 100%;
            height: 160px;
            object-fit: cover;

            border-radius: 12px;
        }

        .product button{
            background-color: orange;
            padding: 10px;
            border-radius: 12px;
            border: none;
            width: 90%;
            
        }
    </style>
</head>
<body>
    <div class="product">
