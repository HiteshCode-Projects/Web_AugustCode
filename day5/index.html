<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background: skyblue;
            width: 300px;
            height: 150px;
            text-align: center;

            border: 1px solid black;

            /* border: 2px dashed red;

            border: 2px dotted red;

            border: 4px double orange;   */

            border-radius: 15px;

            margin: 20px;

            padding: 20px;

            /* margin: auto; */   

            /* box-sizing: content-box;  It WIll Include Width + Padding + margin + Border */

            box-sizing: border-box;


        }

        p{
           border-bottom: 2px double red;
           padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Hello guys</p>
    </div>

    <div class="box">
      <p>Books</p>
    </div>
</body>
</html>
